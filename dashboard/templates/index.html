<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NemotronCoder Telemetry Panel</title>
    <!-- Outfit Font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        /* Modern Premium Dark-Theme Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #080c14;
            color: #e2e8f0;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            line-height: 1.5;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        /* Breathtaking ambient background orbs */
        .bg-glow-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, rgba(99, 102, 241, 0) 70%);
            top: -150px;
            left: -150px;
            z-index: -10;
        }

        .bg-glow-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.08) 0%, rgba(236, 72, 153, 0) 70%);
            bottom: 10%;
            right: -200px;
            z-index: -10;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* Glassmorphic Navigation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            margin-bottom: 32px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .logo-section h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo-section p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .system-stats {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 8px;
            color: #cbd5e1;
        }

        .stat-badge span {
            color: #818cf8;
            font-weight: 600;
        }

        /* Glassmorphism layouts */
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Config / Add Student Panel */
        .config-panel {
            margin-bottom: 32px;
        }

        .config-panel h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 18px;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px 14px;
            color: #f1f5f9;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .form-input:focus {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.05);
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            cursor: pointer;
            user-select: none;
        }

        .toggle-group label {
            cursor: pointer;
        }

        /* Custom switch styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #6366f1;
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            color: #fff;
            padding: 11px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-red {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* Cards Grid */
        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }

        .student-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .student-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f8fafc;
            word-break: break-all;
        }

        .student-info span {
            font-size: 0.75rem;
            color: #64748b;
        }

        /* Beautiful Status Badges */
        .status-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-badge.idle {
            background: rgba(100, 116, 139, 0.12);
            color: #94a3b8;
            border: 1px solid rgba(100, 116, 139, 0.2);
        }

        .status-badge.idle::before {
            background-color: #94a3b8;
        }

        .status-badge.running {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-badge.running::before {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: status-pulse 1.5s infinite;
        }

        .status-badge.completed {
            background: rgba(59, 130, 246, 0.12);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .status-badge.completed::before {
            background-color: #3b82f6;
        }

        .status-badge.captcha-pending {
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.2);
            animation: shake 0.5s infinite alternate;
        }

        .status-badge.captcha-pending::before {
            background-color: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
            animation: status-pulse-warn 1.5s infinite;
        }

        @keyframes status-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        @keyframes status-pulse-warn {
            0% {
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(245, 158, 11, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
            }
        }

        @keyframes shake {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-2px);
            }
        }

        /* Progress Bar Section */
        .progress-section {
            margin: 8px 0;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #6366f1 0%, #ec4899 100%);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Card Controls */
        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: auto;
        }

        .card-actions .btn {
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        /* Danger trigger delete */
        .delete-trigger {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.2s, background-color 0.2s;
            opacity: 0;
        }

        .student-card:hover .delete-trigger {
            opacity: 1;
        }

        .delete-trigger:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        /* Captcha Solve Widget inside Card */
        .captcha-widget {
            background: rgba(245, 158, 11, 0.05);
            border: 1px dashed rgba(245, 158, 11, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .captcha-widget p {
            font-size: 0.8rem;
            color: #fbbf24;
            font-weight: 500;
            text-align: center;
        }

        .captcha-image-wrapper {
            background: #fff;
            padding: 6px;
            border-radius: 6px;
            max-width: 100%;
            display: flex;
            justify-content: center;
        }

        .captcha-image-wrapper img {
            max-height: 50px;
            object-fit: contain;
        }

        .captcha-form {
            display: flex;
            width: 100%;
            gap: 8px;
        }

        .captcha-form input {
            flex-grow: 1;
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        .captcha-form .btn {
            padding: 8px 14px;
            font-size: 0.8rem;
        }

        /* Monospace Logs Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(8, 10, 15, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            width: 100%;
            max-width: 750px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .modal-header h3 {
            font-weight: 600;
            color: #f1f5f9;
        }

        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: #f1f5f9;
        }

        .terminal-logs {
            background: #020617;
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            font-family: 'Fira Code', monospace;
            font-size: 0.82rem;
            color: #38bdf8;
            white-space: pre-wrap;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
        }

        /* Empty state styling */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .empty-state p {
            margin-top: 10px;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <!-- Navigation Header -->
        <header>
            <div class="logo-section">
                <h1>NemotronCoder Control Center</h1>
                <p>Concurrent Multi-Student Automation Dashboard</p>
            </div>
            <div class="system-stats">
                <div class="stat-badge">Total Runs: <span id="stat-total">0</span></div>
                <div class="stat-badge">Active: <span id="stat-active">0</span></div>
            </div>
        </header>

        <!-- Configuration/Add Student Panel -->
        <section class="glass-card config-panel">
            <h2>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="color: #818cf8;">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <line x1="19" x2="19" y1="8" y2="14" />
                    <line x1="22" x2="16" y1="11" y2="11" />
                </svg>
                Register New Student Run
            </h2>
            <form id="add-student-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="username">Username / Roll No.</label>
                        <input type="text" id="username" class="form-input" placeholder="e.g. xxxxxx@rgit" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="target_count">Solve Target Count</label>
                        <input type="number" id="target_count" class="form-input" value="10" min="1" required>
                    </div>
                    <div class="form-group">
                        <div class="toggle-group" onclick="toggleHeadlessSwitch()">
                            <span class="switch">
                                <input type="checkbox" id="headless" checked>
                                <span class="slider"></span>
                            </span>
                            <label for="headless">Run Headless (Silent)</label>
                        </div>
                    </div>
                    <div>
                        <button type="submit" class="btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" x2="12" y1="5" y2="19" />
                                <line x1="5" x2="19" y1="12" y2="12" />
                            </svg>
                            Add Student
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Active Cards Grid -->
        <main class="student-grid" id="students-grid">
            <!-- Dynamic cards will be rendered here -->
            <div class="empty-state">
                <p>No student profiles registered yet.</p>
                <p style="font-size: 0.8rem;">Add credentials above to start scaled automation runs.</p>
            </div>
        </main>
    </div>

    <!-- Logs Terminal Modal -->
    <div class="modal-overlay" id="logs-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="logs-modal-title">Live Automation logs: Username</h3>
                <button class="modal-close" onclick="closeLogsModal()">&times;</button>
            </div>
            <div class="terminal-logs" id="logs-terminal">Loading logs...</div>
        </div>
    </div>

    <script>
        // Main client-side orchestrator logic
        let currentTailingUser = null;
        let logsPollInterval = null;
        let mainPollInterval = null;

        // Auto Poll Students list every 2 seconds
        document.addEventListener('DOMContentLoaded', () => {
            fetchStudents();
            mainPollInterval = setInterval(fetchStudents, 2000);
        });

        function toggleHeadlessSwitch() {
            const cb = document.getElementById('headless');
            cb.checked = !cb.checked;
        }

        // Fetch students and render
        async function fetchStudents() {
            try {
                const res = await fetch('/api/students');
                if (!res.ok) throw new Error("Failed to fetch students list.");
                const students = await res.json();
                renderStudents(students);
            } catch (err) {
                console.error("Error fetching students:", err);
            }
        }

        // Render Student Cards
        function renderStudents(students) {
            const grid = document.getElementById('students-grid');
            const totalBadge = document.getElementById('stat-total');
            const activeBadge = document.getElementById('stat-active');

            totalBadge.textContent = students.length;

            const activeCount = students.filter(s => s.status === 'Running' || s.status === 'Captcha Pending').length;
            activeBadge.textContent = activeCount;

            if (students.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <p>No student profiles registered yet.</p>
                        <p style="font-size: 0.8rem;">Add credentials above to start scaled automation runs.</p>
                    </div>
                `;
                return;
            }

            // Loop and build cards
            let html = "";
            students.forEach(s => {
                const solved = s.solved_count || 0;
                const target = s.target_count || 1;
                const percent = Math.min(100, Math.round((solved / target) * 100));

                // Badges mapping
                let badgeClass = "idle";
                let badgeText = "Idle";
                if (s.status === 'Running') {
                    badgeClass = "running";
                    badgeText = "Running";
                } else if (s.status === 'Captcha Pending') {
                    badgeClass = "captcha-pending";
                    badgeText = "Captcha Pending";
                } else if (s.status === 'Completed') {
                    badgeClass = "completed";
                    badgeText = "Completed";
                }

                // Action buttons configurations
                let actionBtnHtml = "";
                if (s.status === 'Running' || s.status === 'Captcha Pending') {
                    actionBtnHtml = `
                        <button class="btn btn-red" onclick="stopRunner('${s.username}')">Stop Run</button>
                    `;
                } else {
                    actionBtnHtml = `
                        <button class="btn" onclick="startRunner('${s.username}')">Start Run</button>
                    `;
                }

                // Captcha widget HTML if captcha is pending
                let captchaHtml = "";
                if (s.status === 'Captcha Pending') {
                    captchaHtml = `
                        <div class="captcha-widget" id="captcha-widget-${s.username.replace('@', '_').replace('.', '_')}">
                            <p>⚠️ Captcha Solver Blocked! Enter Math Answer:</p>
                            <div class="captcha-image-wrapper">
                                <img src="" id="captcha-img-${s.username.replace('@', '_').replace('.', '_')}" alt="loading captcha...">
                            </div>
                            <form class="captcha-form" onsubmit="submitCaptchaSolution(event, '${s.username}')">
                                <input type="hidden" id="captcha-id-${s.username.replace('@', '_').replace('.', '_')}">
                                <input type="number" id="captcha-input-${s.username.replace('@', '_').replace('.', '_')}" class="form-input" placeholder="Result" required>
                                <button type="submit" class="btn">Proceed</button>
                            </form>
                        </div>
                    `;
                    // Fetch image in background (don't block render loop)
                    fetchCaptchaDetails(s.username);
                }

                html += `
                    <div class="glass-card student-card">
                        <button class="delete-trigger" onclick="deleteStudent('${s.username}')" title="Delete Profile">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                        </button>
                        <div class="card-header">
                            <div class="student-info">
                                <h3>${s.username}</h3>
                                <span>${s.headless ? 'Headless Mode' : 'Headed Mode'}</span>
                            </div>
                            <span class="status-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        
                        <div class="progress-section">
                            <div class="progress-header">
                                <span>Automation Progress</span>
                                <span>${solved}/${target} Solved (${percent}%)</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${percent}%;"></div>
                            </div>
                            <div style="margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: rgba(255, 255, 255, 0.02); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.04);">
                                <label style="font-size: 0.8rem; color: #94a3b8; font-weight: 500;">TARGET PROBLEMS:</label>
                                <input type="number" value="${target}" min="1" 
                                       style="width: 70px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 4px 8px; color: #fff; font-family: inherit; font-size: 0.85rem; outline: none; text-align: center;"
                                       onchange="updateTargetCount('${s.username}', this.value)"
                                       ${s.status === 'Running' || s.status === 'Captcha Pending' ? 'disabled' : ''}>
                            </div>
                        </div>
                        
                        ${captchaHtml}
                        
                        <div class="card-actions">
                            ${actionBtnHtml}
                            <button class="btn btn-secondary" onclick="openLogsModal('${s.username}')">View Logs</button>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        // Form submit handler to add student
        document.getElementById('add-student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const targetInput = document.getElementById('target_count');
            const headlessInput = document.getElementById('headless');

            try {
                const res = await fetch('/api/students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: usernameInput.value,
                        password: passwordInput.value,
                        target_count: parseInt(targetInput.value),
                        headless: headlessInput.checked
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || "Error adding student.");
                    return;
                }

                // Reset Form
                usernameInput.value = '';
                passwordInput.value = '';
                targetInput.value = '10';
                headlessInput.checked = true;

                fetchStudents();
            } catch (err) {
                alert("Error connecting to server.");
            }
        });

        // Update target count for a student profile
        async function updateTargetCount(username, newCount) {
            try {
                const res = await fetch(`/api/students/${username}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        target_count: parseInt(newCount)
                    })
                });
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || "Failed to update target count.");
                    fetchStudents();
                }
            } catch (err) {
                alert("Server connection failed.");
            }
        }

        // Trigger runner
        async function startRunner(username) {
            try {
                const res = await fetch(`/api/students/${username}/start`, { method: 'POST' });
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || "Failed to start runner.");
                }
                fetchStudents();
            } catch (err) {
                alert("Server connection failed.");
            }
        }

        // Stop runner
        async function stopRunner(username) {
            try {
                const res = await fetch(`/api/students/${username}/stop`, { method: 'POST' });
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || "Failed to stop runner.");
                }
                fetchStudents();
            } catch (err) {
                alert("Server connection failed.");
            }
        }

        // Delete profile
        async function deleteStudent(username) {
            if (!confirm(`Are you sure you want to delete profile: ${username}? All progress logs and database state will be erased.`)) return;
            try {
                const res = await fetch(`/api/students/${username}`, { method: 'DELETE' });
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || "Failed to delete student.");
                }
                fetchStudents();
            } catch (err) {
                alert("Server connection failed.");
            }
        }

        // Fetch Captcha base64 details
        async function fetchCaptchaDetails(username) {
            const selectorName = username.replace('@', '_').replace('.', '_');
            try {
                const res = await fetch(`/api/students/${username}/captcha`);
                if (res.ok) {
                    const data = await res.json();
                    const imgEl = document.getElementById(`captcha-img-${selectorName}`);
                    const idEl = document.getElementById(`captcha-id-${selectorName}`);
                    if (imgEl && idEl) {
                        imgEl.src = data.image_b64;
                        idEl.value = data.id;
                    }
                }
            } catch (err) {
                console.error("Error loading captcha image details:", err);
            }
        }

        // Solve captcha
        async function submitCaptchaSolution(e, username) {
            e.preventDefault();
            const selectorName = username.replace('@', '_').replace('.', '_');
            const idEl = document.getElementById(`captcha-id-${selectorName}`);
            const inputEl = document.getElementById(`captcha-input-${selectorName}`);

            try {
                const res = await fetch(`/api/students/${username}/captcha/solve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        captcha_id: parseInt(idEl.value),
                        answer: inputEl.value
                    })
                });

                if (res.ok) {
                    inputEl.value = '';
                    fetchStudents();
                } else {
                    const err = await res.json();
                    alert(err.detail || "Failed to solve captcha.");
                }
            } catch (err) {
                alert("Server connection failed.");
            }
        }

        // Logs Viewer Modal operations
        function openLogsModal(username) {
            currentTailingUser = username;
            document.getElementById('logs-modal-title').textContent = `Live Automation Logs: ${username}`;
            document.getElementById('logs-terminal').textContent = "Loading logs from server...";
            document.getElementById('logs-modal').style.display = 'flex';

            // Initial read
            fetchLogs(username);

            // Poll logs every 2 seconds
            if (logsPollInterval) clearInterval(logsPollInterval);
            logsPollInterval = setInterval(() => {
                if (currentTailingUser) fetchLogs(currentTailingUser);
            }, 2000);
        }

        async function fetchLogs(username) {
            try {
                const res = await fetch(`/api/students/${username}/logs`);
                if (res.ok) {
                    const data = await res.json();
                    const terminal = document.getElementById('logs-terminal');
                    terminal.textContent = data.logs || "No logs yet.";

                    // Auto scroll to bottom
                    terminal.scrollTop = terminal.scrollHeight;
                }
            } catch (err) {
                console.error("Error tailing logs:", err);
            }
        }

        function closeLogsModal() {
            currentTailingUser = null;
            if (logsPollInterval) clearInterval(logsPollInterval);
            document.getElementById('logs-modal').style.display = 'none';
        }
    </script>
</body>

</html>
